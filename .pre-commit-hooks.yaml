- id: pezin-prepare
  name: Pezin Prepare Commit
  description: Detects amend/rebase operations and validates commit format
  entry: python -m pezin.hooks.prepare_commit_msg
  language: python
  stages: [prepare-commit-msg]
  always_run: true
  pass_filenames: false

- id: pezin-post
  name: Pezin Post Commit
  description: Bumps version and creates git tags after commit completes
  entry: python -m pezin.hooks.post_commit
  language: python
  stages: [post-commit]
  always_run: true
  pass_filenames: false
