name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for PyPI trusted publishing

# Serialize release runs so concurrent tag pushes cannot race the publish
# chain (skipped runs queue briefly, then no-op).
concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release-guard:
    name: Release Guard (skip already-published versions)
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.guard.outputs.should_release }}
    steps:
      - name: Compare tag version with the latest published PyPI version
        id: guard
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_REF#v}"
          PYPI_VERSION="$(
            curl -fsS --max-time 30 https://pypi.org/pypi/pezin/json               | jq -r '.info.version' 2>/dev/null || true
          )"

          if [ -z "$PYPI_VERSION" ] || [ "$PYPI_VERSION" = "null" ]; then
            echo "No published pezin found on PyPI; proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 -m pip install --quiet packaging
          SHOULD="$(python3 - "$TAG_VERSION" "$PYPI_VERSION" <<'PYEOF'
          import sys
          from packaging.version import Version
          tag, published = sys.argv[1], sys.argv[2]
          # Only strictly newer versions are released; equal or older tags
          # (already published, or stale backlog tags pushed accidentally)
          # are skipped.
          print("true" if Version(tag) > Version(published) else "false")
          PYEOF
          )"

          if [ "$SHOULD" = "true" ]; then
            echo "Tag ${TAG_VERSION} is newer than PyPI ${PYPI_VERSION}; releasing."
          else
            echo "Tag ${TAG_VERSION} is NOT newer than PyPI ${PYPI_VERSION}; skipping release."
          fi
          echo "should_release=${SHOULD}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    needs: release-guard
    if: needs.release-guard.outputs.should_release == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run tests
      run: |
        uv run ruff check .
        uv run ruff format --check .
        uv run pytest -v

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [release-guard, test]
    if: needs.release-guard.outputs.should_release == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: uv python install 3.12

    - name: Build package
      run: |
        uv build

    - name: Store the distribution packages
      uses: actions/upload-artifact@v6
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/pezin
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download all the dists
      uses: actions/download-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    - name: Extract tag name
      id: tag
      run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Get release notes from CHANGELOG
      id: changelog
      run: |
        if [ -f CHANGELOG.md ]; then
          # Extract the section for THIS tag (falls back to the newest
          # section when the tag has no entry).
          TAG="${{ steps.tag.outputs.tag_name }}"
          TAG="${TAG#v}"  # CHANGELOG headers use bare versions ([0.8.2])
          awk -v tag="$TAG" '
            /^## \[/ {
              if (in_section) { exit }
              in_section = index($0, "[" tag "]") > 0
              if (in_section) { print }
              next
            }
            in_section { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            awk '/^## \[/{if(++c==2) exit} c==1{print}' CHANGELOG.md > release_notes.md
          fi
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "release_notes=Release ${{ steps.tag.outputs.tag_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: Release ${{ steps.tag.outputs.tag_name }}
        body: ${{ steps.changelog.outputs.release_notes }}
        files: dist/*
        draft: false
        prerelease: ${{ contains(steps.tag.outputs.tag_name, 'alpha') || contains(steps.tag.outputs.tag_name, 'beta') || contains(steps.tag.outputs.tag_name, 'rc') }}

  publish-to-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pezin
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
